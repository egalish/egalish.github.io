title: Gabriele Forni - Security Writeups
description: Web application penetration testing write-ups and vulnerability research
theme: just-the-docs

url: "https://egalish.github.io"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_sensitive
nav_external_links:
  - title: GitHub Profile
    url: https://github.com/egalish
    opens_in_new_tab: true
  - title: LinkedIn
    url: https://www.linkedin.com/in/gabriele--forni
    opens_in_new_tab: true

# Enable copy button on code blocks
enable_copy_code_button: true

# Aux links
aux_links:
  "View on GitHub":
    - "https://github.com/egalish/egalish.github.io"

# Color scheme
color_scheme: dark

# Callouts
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

plugins:
  - jekyll-seo-tag
